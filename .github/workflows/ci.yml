# Frontend CI — M0.2
#
# There was no workflow in this directory before. The backend's deploy.yml was
# the only CI in either repo, so a frontend regression could not fail a build.
#
# Order is deliberate and cheapest-fails-first:
#   typecheck → lint → test → build
#
# `tsc --noEmit` runs before lint because a type error is a hard failure that
# lint will not catch, and running it first means the fast check reports first.
#
# `npm run build` is last because it is by far the slowest. It was previously
# absent, which let a CSS-module error ship: `composes` is illegal inside an
# `@media` block, and neither tsc, eslint nor vitest evaluate CSS — only the
# Turbopack build does. Typecheck and lint stayed green the whole time.

name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: typecheck, lint, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        # `npm ci` rather than `npm install`: it installs exactly the lockfile,
        # so a lockfile that has drifted from package.json fails here rather
        # than silently passing in CI and failing on a developer machine.
        run: npm ci

      - name: Typecheck
        working-directory: frontend
        run: npm run typecheck

      - name: Lint
        working-directory: frontend
        run: npm run lint

      - name: Test
        working-directory: frontend
        run: npm test

      - name: Build
        working-directory: frontend
        # The only step that evaluates CSS Modules, so it is the only thing
        # that catches `composes` inside a media query, an undefined
        # `var()` target, or a bad CSS-module import path.
        run: npm run build